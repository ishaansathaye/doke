server {
    listen 80 default_server;
    server_name _;
    root /opt/doke/current;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/wasm application/octet-stream application/json text/css application/javascript font/ttf;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cache-Control "no-cache" always;
    location / { try_files $uri $uri/ =404; }
    location = /health { default_type text/plain; return 200 "doke ok\n"; }
}
