<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#050606" />
    <meta
      name="description"
      content="Look inside a CPU, a GPU and the human brain. Explore architecture, follow a value through an executable model, and compare how information moves."
    />
    <title>doke</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="silicon.css" />
  </head>
  <body data-world="gpu" data-level="processor">
    <a class="skip" href="#run">Skip to controls</a>
    <header>
      <a class="brand" href="./" aria-label="doke home">doke<span>◦</span></a>
      <nav class="worlds" aria-label="Explore">
        <button data-world="cpu">CPU</button
        ><button data-world="gpu" aria-pressed="true">GPU</button
        ><button data-world="brain">Human brain</button>
      </nav>
      <div class="header-actions">
        <button id="compare-toggle" aria-pressed="false">
          Compare brain <span>↗</span></button
        ><button
          id="settings-toggle"
          aria-label="Display and reference settings"
        >
          ⋯
        </button>
      </div>
    </header>
    <main>
      <section
        id="chip-stage"
        class="stage"
        aria-label="Processor architecture"
      >
        <canvas
          id="chip-canvas"
          tabindex="0"
          aria-label="Interactive processor. Drag to orbit, Shift-drag to pan, pinch or scroll to zoom, click a component to inspect, double click a core to enter. Arrow keys orbit, plus and minus zoom, Home resets."
        ></canvas>
        <div id="chip-labels" aria-hidden="true"></div>
      </section>
      <section
        id="brain-stage"
        class="stage"
        hidden
        aria-label="Human reference brain"
      >
        <canvas id="brain-canvas" tabindex="0"></canvas>
        <div id="brain-loading" role="status">Opening the atlas…</div>
      </section>
      <div class="scene-heading">
        <div id="eyebrow" class="eyebrow">INSIDE THE GPU</div>
        <h1 id="scene-title" data-hdr>RTX 5090</h1>
        <p id="scene-description">
          170 streaming multiprocessors. Start with one.
        </p>
        <nav id="depth-nav" aria-label="Level of detail">
          <button data-level="processor" aria-current="step">Processor</button
          ><span>›</span><button data-level="core">Inside an SM</button
          ><span>›</span><button data-level="execution">Follow a value</button>
        </nav>
      </div>
      <div id="brain-label" hidden>
        <span class="eyebrow">HUMAN REFERENCE ATLAS</span>
        <h2>The human brain</h2>
        <canvas
          id="brain-stimulus"
          width="128"
          height="128"
          aria-label="Same input image; no predicted neural response"
        ></canvas>
      </div>
      <div class="view-tools" aria-label="Camera">
        <button id="zoom-in" aria-label="Zoom in">+</button
        ><button id="zoom-out" aria-label="Zoom out">−</button
        ><button id="reset-camera" aria-label="Reset view">↺</button>
      </div>
      <button id="level-enter" class="enter-cue">
        Explore one SM <span>↘</span>
      </button>
      <div id="hover-label" aria-hidden="true"></div>
      <div id="loading" role="status">Preparing the view…</div>
      <aside
        id="reader"
        class="glass"
        hidden
        aria-label="Information and controls"
      >
        <div class="reader-top">
          <div
            id="reader-tabs"
            role="tablist"
            aria-label="Open information"
          ></div>
          <button id="reader-close" aria-label="Close panel">×</button>
        </div>
        <div id="inspection" tabindex="0"></div>
      </aside>
      <aside
        id="settings"
        class="glass"
        hidden
        aria-label="Display and reference settings"
      >
        <label
          >Image clarity<select id="resolution">
            <option value="balanced">Balanced</option>
            <option value="sharp" selected>Sharp</option>
            <option value="ultra">Ultra</option>
          </select></label
        >
        <label
          >Light<select id="light-mode">
            <option value="auto">Adaptive HDR</option>
            <option value="sdr">SDR glow</option>
            <option value="quiet">Quiet</option>
          </select></label
        >
        <label
          ><span>Reduce motion</span><input type="checkbox" id="reduce-motion"
        /></label>
        <label id="gpu-reference"
          >GPU reference<select id="profile">
            <option value="rtx-5090">RTX 5090 · Blackwell</option>
            <option value="h100-sxm">H100 SXM · Hopper</option>
          </select></label
        >
        <label
          >Brain surface<select id="brain-quality">
            <option value="overview">Overview · 270k triangles</option>
            <option value="fine">Fine · 2.1m triangles</option>
            <option value="native">Native · 5.1m triangles</option>
          </select></label
        >
        <p id="quality-status" class="muted"></p>
        <p id="light-status" class="muted"></p>
        <button id="about">Sources & model boundaries ↗</button>
      </aside>
      <div id="brain-guide" hidden>
        <div class="guide-heading">
          <span id="brain-guide-time" class="eyebrow">GUIDE TIME</span>
          <h2 id="brain-guide-title">Find the visual landmarks</h2>
        </div>
        <p id="brain-guide-copy" hidden></p>
        <div class="guide-controls">
          <button id="brain-guide-play">Play guide</button
          ><button id="brain-guide-next">Next</button
          ><button id="brain-guide-reset" aria-label="Reset guide">↺</button
          ><button id="brain-guide-evidence">Explain ↗</button>
        </div>
        <canvas id="guide-stimulus" width="1" height="1" hidden></canvas>
      </div>
      <div id="dock" class="glass">
        <div id="compute-controls">
          <button id="run" class="primary" disabled>
            Follow a value <span>↗</span></button
          ><button id="step" hidden aria-label="Advance one model tick">
            Step</button
          ><button id="reset" hidden aria-label="Reset computation">↺</button
          ><span class="divider"></span><button id="input-toggle">Input</button
          ><button id="explain">Explain this view</button
          ><span id="run-summary" class="muted"></span>
        </div>
        <div id="brain-controls" hidden>
          <button id="anatomy" class="primary">Explore anatomy</button
          ><button id="brain-cutaway">Look inside</button
          ><button id="brain-vision">How we see</button
          ><button id="brain-evidence">Evidence ↗</button>
        </div>
      </div>
      <div id="comparison-mobile" hidden>
        <button data-comparison-view="chip" aria-pressed="true">
          Processor</button
        ><button data-comparison-view="brain">Brain</button>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
    </main>
    <footer>
      <span id="scene-note"
        >Original functional schematic · source-linked architecture</span
      ><span id="render-status"></span>
    </footer>
    <script type="module" src="silicon.js"></script>
  </body>
</html>
