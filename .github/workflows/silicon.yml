name: Silicon and brain
on: [pull_request]
permissions:
  contents: read
jobs:
  sources-and-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: node tests/hardware-catalog.mjs
      - run: cargo test -p doke-core --locked
